buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
        maven { url = 'https://maven.minecraftforge.net/' }
        gradlePluginPortal()
    }
    dependencies {
        classpath group: 'org.spongepowered', name: 'mixingradle', version: '0.7.+'
        classpath 'net.minecraftforge.gradle:ForgeGradle:6.0.+'
    }
}

subprojects {
    apply plugin: 'eclipse'
    apply plugin: 'idea'
    apply plugin: 'maven-publish'
    apply plugin: 'net.minecraftforge.gradle'
    apply plugin: 'org.spongepowered.mixin'

    version = mod_version
    group = mod_group_id

    java.toolchain.languageVersion = JavaLanguageVersion.of(17)

    minecraft {
        mappings channel: mapping_channel, version: mapping_version
        copyIdeResources = true

        runs {
            configureEach {
                workingDirectory project.file('run')
                property 'forge.logging.markers', 'REGISTRIES'
                property 'forge.logging.console.level', 'debug'
                mods {
                    "${project.name}" {
                        source sourceSets.main
                    }
                }
            }
            client { }
            server { args '--nogui' }
        }
    }

    repositories {
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url 'https://cursemaven.com' }
        maven { url 'https://maven.blamejared.com' }
        flatDir { dir rootProject.file('libs') }
    }

    dependencies {
        minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

        compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))
        annotationProcessor 'org.spongepowered:mixin:0.8.5'
        annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
        compileOnly 'org.jetbrains:annotations:24.0.1'
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    tasks.named('processResources', ProcessResources).configure {
        var replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            forge_version           : forge_version,
            forge_version_range     : forge_version_range,
            loader_version_range    : loader_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_authors             : mod_authors,
            mod_description         : mod_description,
            mod_url                 : mod_url,
            tacz_version            : tacz_version,
            irons_spellbooks_version: irons_spellbooks_version,
            irons_lib_version       : irons_lib_version,
            curios_version          : curios_version,
            jei_version             : jei_version
        ]
        inputs.properties replaceProperties
        filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
            expand replaceProperties + [project: project]
        }
    }

    tasks.named('jar', Jar).configure {
        manifest {
            attributes([
                'Specification-Title'     : project.name,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
            ])
        }
        finalizedBy 'reobfJar'
    }

    // 禁用 jarJar 任务，不生成 -all jar
    tasks.matching { it.name == 'jarJar' }.configureEach {
        enabled = false
    }
    tasks.matching { it.name == 'reobfJarJar' }.configureEach {
        enabled = false
    }
}
